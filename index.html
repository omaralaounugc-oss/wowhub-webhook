<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WowHub - Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 60% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
    z-index: 0;
  }
  .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(99, 102, 241, 0.6);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10px) translateX(30px); opacity: 0; }
  }
  .container { position: relative; z-index: 1; width: 90%; max-width: 480px; }
  .card {
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 20px;
    padding: 40px 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.05), 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(99, 102, 241, 0.05);
    text-align: center;
  }
  .logo-wrap { margin-bottom: 28px; }
  .logo-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3); }
    50% { box-shadow: 0 8px 50px rgba(99, 102, 241, 0.5); }
  }
  h1 { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  h1 span { background: linear-gradient(90deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: rgba(255,255,255,0.35); font-size: 13px; margin-top: 4px; }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.3), transparent); margin: 28px 0; }
  .state { display: none; }
  .state.active { display: block; }
  #state-loading .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(99,102,241,0.15);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #state-loading p { color: rgba(255,255,255,0.5); font-size: 14px; }
  #state-success .check-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 16px;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  #state-success h2 { color: #10b981; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  #state-success .desc { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 24px; }
  .key-box {
    background: rgba(99,102,241,0.06);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 12px;
    padding: 16px 20px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .key-label { color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; text-align: left; }
  .key-value { color: #a5b4fc; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 2px; word-break: break-all; text-align: left; }
  .copy-btn {
    background: linear-gradient(135deg, #4f46e5, #6d28d9);
    border: none; border-radius: 10px;
    width: 44px; height: 44px; min-width: 44px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }
  .copy-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
  .copy-btn.copied { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
  .copy-toast { color: #10b981; font-size: 12px; margin-top: 8px; height: 16px; transition: opacity 0.3s; }
  .expiry {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; margin-top: 12px;
  }
  .expiry-label { color: rgba(255,255,255,0.3); font-size: 12px; }
  .expiry-date { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; }
  #state-error .error-icon { font-size: 48px; margin-bottom: 16px; display: block; animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #state-error h2 { color: #ef4444; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  #state-error p { color: rgba(255,255,255,0.4); font-size: 13px; }
  .footer { margin-top: 24px; color: rgba(255,255,255,0.15); font-size: 11px; }
  .footer span { color: rgba(99,102,241,0.5); }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">🔮</div>
      <h1>WOW<span>HUB</span></h1>
      <p class="subtitle">Key System</p>
    </div>

    <div class="divider"></div>

    <div class="state active" id="state-loading">
      <div class="spinner"></div>
      <p>Loading your key...</p>
    </div>

    <div class="state" id="state-success">
      <div class="check-icon">✅</div>
      <h2>Your key is ready!</h2>
      <p class="desc">Copy the key and paste it into the script</p>
      <div class="key-box">
        <div style="text-align:left; flex:1;">
          <div class="key-label">Your own key</div>
          <div class="key-value" id="key-display">—</div>
        </div>
        <button class="copy-btn" id="copy-btn" onclick="copyKey()">📋</button>
      </div>
      <div class="copy-toast" id="copy-toast"></div>
      <div class="expiry">
        <span class="expiry-label">⏳ Valid until</span>
        <span class="expiry-date" id="expiry-display">—</span>
      </div>
    </div>

    <div class="state" id="state-error">
      <span class="error-icon">❌</span>
      <h2>An error occurred</h2>
      <p id="error-msg">Can't load the key</p>
    </div>

    <div class="footer">Powered by <span>WowHub</span> • Key System v2</div>
  </div>
</div>

<script>
// Background particles
const container = document.getElementById('particles');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    animation-duration: ${6 + Math.random() * 10}s;
    animation-delay: ${Math.random() * 8}s;
    width: ${1 + Math.random() * 2}px;
    height: ${1 + Math.random() * 2}px;
    opacity: ${0.3 + Math.random() * 0.5};
  `;
  container.appendChild(p);
}

const SUPABASE_URL = 'https://dmxiyythvdeesolugjej.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGl5eXRodmRlZXNvbHVnamVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDY5MTQsImV4cCI6MjEwNTIyMjkxNH0.5XWdXplG5NMOAzOtgZdoLQHKsBgnj-Ookl7WeWnaeFQ';

const params = new URLSearchParams(window.location.search);
const clickId = params.get('key');

function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return iso; }
}

let currentKey = '';

async function loadKey() {
  if (!clickId || clickId === '{CLICK_ID}') {
    showState('state-error');
    document.getElementById('error-msg').textContent = 'Link not found';
    return;
  }

  try {
    // Search Supabase for the key linked to the CLICK_ID
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(clickId)}&select=key,expires_at`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    const data = await res.json();

    if (!data || data.length === 0) {
      // Key not ready yet — wait a few seconds and retry
      await new Promise(r => setTimeout(r, 3000));
      return loadKey();
    }

    const record = data[0];
    currentKey = record.key;
    document.getElementById('key-display').textContent = currentKey;
    document.getElementById('expiry-display').textContent = formatDate(record.expires_at);
    showState('state-success');

  } catch (err) {
    showState('state-error');
    document.getElementById('error-msg').textContent = 'Error loading information';
  }
}

function copyKey() {
  if (!currentKey) return;
  navigator.clipboard.writeText(currentKey).then(() => {
    const btn = document.getElementById('copy-btn');
    const toast = document.getElementById('copy-toast');
    btn.classList.add('copied');
    btn.textContent = '✅';
    toast.textContent = '✓  Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '📋';
      toast.textContent = '';
    }, 2000);
  });
}

loadKey();
</script>
</body>
</html>
