<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WowHub - Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(async function() {
  const VALID_TOKEN = 'WOWHUB2026';
  const BASE_URL = 'https://wowhub-webhook.vercel.app/index.html';

  const params = new URLSearchParams(window.location.search);
  // إذا لم يتم إرسال token في الرابط، نستخدم الـ VALID_TOKEN لتشغيل getkey دائماً
  const token = params.get('token') || VALID_TOKEN;

  // --- Helper: redirect to external index.html ---
  function goToIndex(key, expiresAt) {
    if (key && expiresAt) {
      const dest = BASE_URL + '?key=' + encodeURIComponent(key) + '&expiry=' + encodeURIComponent(expiresAt);
      window.location.replace(dest);
    } else {
      window.location.replace(BASE_URL);
    }
  }

  // --- Check cached key ---
  const cachedKey    = localStorage.getItem('wowhub_key');
  const cachedExpiry = localStorage.getItem('wowhub_key_expiry');

  if (cachedKey && cachedExpiry) {
    if (new Date(cachedExpiry) > new Date()) {
      // Valid key — skip fetch, go straight to vercel site with key
      goToIndex(cachedKey, cachedExpiry);
      return;
    } else {
      // Expired — clear cache
      localStorage.removeItem('wowhub_key');
      localStorage.removeItem('wowhub_key_expiry');
    }
  }

  // --- Fetch key from API ---
  try {
    const res  = await fetch('/api/getkey?token=' + encodeURIComponent(token));
    const data = await res.json();

    if (data && data.key && data.expires_at) {
      localStorage.setItem('wowhub_key',        data.key);
      localStorage.setItem('wowhub_key_expiry', data.expires_at);
      goToIndex(data.key, data.expires_at);
    } else {
      console.error('API Error:', data);
    }
  } catch (e) {
    console.error('Network Error:', e);
  }
})();
</script>
</body>
</html>
