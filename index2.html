<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WowHub - Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(async function() {
  const VALID_TOKEN = 'WOWHUB2026';
  const BASE_URL = 'https://wowhub-webhook.vercel.app/index.html';

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  // --- Helper: redirect to external index.html ---
  function goToIndex(key = '', expiresAt = '') {
    let dest = BASE_URL;
    if (key && expiresAt) {
      dest += '?key=' + encodeURIComponent(key) + '&expiry=' + encodeURIComponent(expiresAt);
    }
    window.location.replace(dest);
  }

  // Token check
  if (!token || token !== VALID_TOKEN) {
    goToIndex();
    return;
  }

  // --- Check cached key ---
  const cachedKey    = localStorage.getItem('wowhub_key');
  const cachedExpiry = localStorage.getItem('wowhub_key_expiry');

  if (cachedKey && cachedExpiry) {
    if (new Date(cachedExpiry) > new Date()) {
      // Valid key — skip everything, go straight to vercel site
      goToIndex(cachedKey, cachedExpiry);
      return;
    } else {
      // Expired — clear cache
      localStorage.removeItem('wowhub_key');
      localStorage.removeItem('wowhub_key_expiry');
    }
  }

  // --- No valid cached key: fetch from API ---
  try {
    const res  = await fetch('/api/getkey?token=' + token);
    const data = await res.json();

    if (!res.ok || !data.key) {
      goToIndex();
      return;
    }

    localStorage.setItem('wowhub_key',        data.key);
    localStorage.setItem('wowhub_key_expiry', data.expires_at);
    goToIndex(data.key, data.expires_at);

  } catch (e) {
    // Network error — go to vercel site
    goToIndex();
  }
})();
</script>
</body>
</html>
