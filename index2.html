<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WowHub</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a1a; }
</style>
</head>
<body>
<!-- Invisible bridge page: nothing is shown, it only fetches the key and forwards it -->
<script>
(async function() {
  const VALID_TOKEN = 'WOWHUB2026';
  const KEY_PAGE    = 'index.html';

  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');

  // Bad / missing token -> go to key page with no data (it shows its own error)
  if (!token || token !== VALID_TOKEN) {
    window.location.replace(KEY_PAGE);
    return;
  }

  // Send key + expiry to the key page
  function goToIndex(key, expiresAt) {
    window.location.replace(
      KEY_PAGE + '?key=' + encodeURIComponent(key) +
      '&expiry=' + encodeURIComponent(expiresAt)
    );
  }

  // Already has a still-valid key on this browser? Reuse it.
  try {
    const cachedKey    = localStorage.getItem('wowhub_key');
    const cachedExpiry = localStorage.getItem('wowhub_key_expiry');
    if (cachedKey && cachedExpiry) {
      if (new Date(cachedExpiry) > new Date()) {
        goToIndex(cachedKey, cachedExpiry);
        return;
      }
      localStorage.removeItem('wowhub_key');
      localStorage.removeItem('wowhub_key_expiry');
    }
  } catch (e) {}

  // Get a fresh key (and its time) from Neon through the API
  try {
    const res  = await fetch('/api/getkey?token=' + encodeURIComponent(token));
    const data = await res.json();

    if (!res.ok || !data.key) {
      window.location.replace(KEY_PAGE);
      return;
    }

    try {
      localStorage.setItem('wowhub_key',        data.key);
      localStorage.setItem('wowhub_key_expiry', data.expires_at);
    } catch (e) {}

    goToIndex(data.key, data.expires_at);
  } catch (e) {
    window.location.replace(KEY_PAGE);
  }
})();
</script>
</body>
</html>
