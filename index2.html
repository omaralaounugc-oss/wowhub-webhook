  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    background: rgba(100, 100, 255, 0.3);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 50px;
    width: 420px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .logo {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .brand { font-size: 22px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
  .brand span { color: #6c63ff; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 30px; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px; }

  /* Loading state */
  .spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #aaa; font-size: 14px; }

  /* Success state */
  .success-icon {
    width: 60px; height: 60px;
    background: rgba(34,197,94,0.15);
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .success-title { color: #22c55e; font-size: 18px; font-weight: bold; margin-bottom: 6px; }
  .success-msg { color: #aaa; font-size: 13px; margin-bottom: 20px; }
  .key-box {
    background: rgba(108,99,255,0.1);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .key-box:hover { background: rgba(108,99,255,0.2); }
  .key-label { font-size: 11px; color: #888; margin-bottom: 4px; text-align: left; }
  .key-value { font-size: 15px; font-weight: bold; color: white; letter-spacing: 1px; }
  .copy-icon { font-size: 20px; opacity: 0.6; }
  .copy-hint { font-size: 11px; color: #666; margin-bottom: 20px; }

  .expires-box {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }

  .btn-redirect {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-redirect:hover { background: #222; }

  /* Error state */
  .error-icon {
    width: 60px; height: 60px;
    background: rgba(239,68,68,0.15);
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .error-title { color: #ef4444; font-size: 18px; font-weight: bold; margin-bottom: 6px; }
  .error-msg { color: #aaa; font-size: 13px; }

  .footer { margin-top: 20px; font-size: 11px; color: #333; }

  <div class="brand">WOW<span>HUB</span></div>
  <div class="subtitle">Key System</div>
  <hr class="divider">

  <!-- Loading -->
  <div id="state-loading" class="state active">
    <div class="spinner"></div>
    <div class="loading-text">Preparing your key...</div>
  </div>

  <!-- Success -->
  <div id="state-success" class="state">
    <div class="success-icon">✅</div>
    <div class="success-title">Your key is ready!</div>
    <div class="success-msg">Copy the key and enter it in the script</div>

    <div class="key-label">Your own key</div>
    <div class="key-box" onclick="copyKey()">
      <div>
        <div class="key-value" id="key-display">-</div>
      </div>
      <div class="copy-icon">📋</div>
    </div>
    <div class="copy-hint" id="copy-hint">Click to copy the key</div>

    <div class="expires-box">
      <span>⏳ Valid until</span>
      <span id="expires-display">-</span>
    </div>

    <button class="btn-redirect" onclick="goToVerify()">Open Verification Page →</button>
  </div>

  <!-- Error -->
  <div id="state-error" class="state">
    <div class="error-icon">❌</div>
    <div class="error-title">An error occurred</div>
    <div class="error-msg" id="error-msg">No keys available at the moment</div>
  </div>

  <div class="footer">Powered by <a href="#">WowHub</a> • Key System v2</div>
</div>

<script>

// Verify the token
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const VALID_TOKEN = 'WOWHUB2026'; // Change this to any password you want

let assignedKey = '';
let expiresAt = '';

function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return iso; }
}

function copyKey() {
  if (!assignedKey) return;
  navigator.clipboard.writeText(assignedKey).then(() => {
    document.getElementById('copy-hint').textContent = '✅ Copied!';
    setTimeout(() => {
      document.getElementById('copy-hint').textContent = 'Click to copy the key';
    }, 2000);
  });
}

function goToVerify() {
  if (assignedKey) {
    window.location.href = `https://wowhub-webhook.vercel.app/index.html?key=${encodeURIComponent(assignedKey)}`;
  }
}

async function getAvailableKey() {
  if (!token || token !== VALID_TOKEN) {
    showState('state-error');
    document.getElementById('error-msg').textContent = 'Invalid link. Complete the tasks first!';
    return;
  }

  try {
    const res = await fetch(`/api/getkey?token=${token}`);
    const data = await res.json();

    if (!res.ok || !data.key) {
      showState('state-error');
      document.getElementById('error-msg').textContent = data.error || 'No keys available';
      return;
    }

    assignedKey = data.key;
    expiresAt = data.expires_at;

    document.getElementById('key-display').textContent = assignedKey;
    document.getElementById('expires-display').textContent = formatDate(expiresAt);
    showState('state-success');

    setTimeout(() => {
      goToVerify();
    }, 3000);

  } catch (err) {
    showState('state-error');
    document.getElementById('error-msg').textContent = 'Connection error: ' + err.message;
  }
}

// Start
getAvailableKey();
</script>
